<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jokenpô</title>
</head>

<body>
    <main class="container">
        <div class="results">
            <div>
                <span class="user-result">
                    <img src="images/pedra.png" alt="escolha do usuario">
                </span>
                <span class="conputer-result">
                    <img src="images/pedra.png" alt="escolha do computador">
                </span>
            </div>
            <p class="result-text">Bora Jogar?</p>
        </div>
        <div class="options">
            <div>
                <span class="option-image">
                    <img src="images/pedra.png" alt="img Pedra">
                    <p>Pedra</p>
                </span>
                <span class="option-image">
                    <img src="images/papel.png" alt="img Papel">
                    <p>Papel</p>
                </span>
                <span class="option-image">
                    <img src="images/tesoura.png" alt="img Tesoura">
                    <p>Tesoura</p>
                </span>
            </div>
        </div>
    </main>
</body>

</html>
